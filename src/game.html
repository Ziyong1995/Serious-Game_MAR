<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Watershed Council</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a cross-section board (land / geology / shared aquifer) across the top, the active player's desk below: catchment sheet left, action tabs right. */
:root{
  --bg:#e9efee; --surface:#f8fbfb; --surface-2:#eef4f4; --ink:#13232a; --muted:#566a70; --line:#c9d6d6;
  --water:#1d6f8f; --water-2:#5aa9c6; --water-soft:#d3e8ef; --aq-deep:#174e66;
  --grey:#6f7a82; --nbs:#3f8f57; --mar:#2477a3;
  --good:#2c855a; --warn:#b97c12; --bad:#b0412e;
  --city:#8b929b; --agri:#d4ae45; --forest:#3c7a4c; --pasture:#97bf6d;
  --sand:#e1c98a; --silt:#b39c7b; --clay:#a4624b; --karst:#c9c7be;
  --contam:#7a5a2a;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0d171b; --surface:#14222a; --surface-2:#1a2b34; --ink:#e2ecee; --muted:#93a8ae; --line:#28404a;
  --water:#4fb0d3; --water-2:#2f86a8; --water-soft:#18394a; --aq-deep:#0f3446;
  --grey:#97a2aa; --nbs:#5fb779; --mar:#4ea6d6;
  --good:#53b783; --warn:#e0a63a; --bad:#e2725c;
  --city:#7c838c; --agri:#b8952f; --forest:#3f8a55; --pasture:#7fa85a;
  --sand:#b9a368; --silt:#8e7a5d; --clay:#8c4f3b; --karst:#9a988f; --contam:#a07a3c;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0d171b; --surface:#14222a; --surface-2:#1a2b34; --ink:#e2ecee; --muted:#93a8ae; --line:#28404a;
  --water:#4fb0d3; --water-2:#2f86a8; --water-soft:#18394a; --aq-deep:#0f3446;
  --grey:#97a2aa; --nbs:#5fb779; --mar:#4ea6d6;
  --good:#53b783; --warn:#e0a63a; --bad:#e2725c;
  --city:#7c838c; --agri:#b8952f; --forest:#3f8a55; --pasture:#7fa85a;
  --sand:#b9a368; --silt:#8e7a5d; --clay:#8c4f3b; --karst:#9a988f; --contam:#a07a3c;
  color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:max(16px, env(safe-area-inset-top, 0px)) max(40px, env(safe-area-inset-bottom, 0px))}
html,body{margin:0} [hidden]{display:none!important} img{max-width:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--water);outline-offset:2px}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* top bar */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-size:28px;font-weight:800;letter-spacing:-.02em}
.brand h1 span{color:var(--water)}
.status{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;white-space:nowrap}
.pill b{font-family:var(--mono);font-weight:500}
.pill.warn{border-color:var(--warn);color:var(--warn)}
.pill.bad{border-color:var(--bad);color:var(--bad)}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:13px}
.ghost:hover{background:var(--surface)}

/* board */
.boardwrap{overflow-x:auto;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
.board{min-width:640px;display:grid;padding:14px 14px 0}
.cols{display:grid;gap:10px}
.col{display:flex;flex-direction:column;gap:6px;padding:8px;border-radius:10px 10px 0 0;border:2px solid transparent;border-bottom:none}
.col.active{border-color:var(--pc);background:var(--surface-2)}
.colhead{display:flex;justify-content:space-between;align-items:center;gap:6px;font-weight:600;font-size:14px}
.chip{width:10px;height:10px;border-radius:3px;background:var(--pc);display:inline-block;flex:none}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:4px}
.tile{aspect-ratio:1;border-radius:6px;display:grid;place-items:center;color:#fff;position:relative;max-width:100%}
.tile svg{width:60%;height:60%;fill:currentColor}
.tile.city{background:var(--city)} .tile.agri{background:var(--agri)} .tile.forest{background:var(--forest)} .tile.pasture{background:var(--pasture)}
.tile .dot{position:absolute;bottom:2px;right:3px;font:500 9px/1 var(--mono)}
.structs{display:flex;flex-wrap:wrap;gap:3px;min-height:22px}
.s{font:500 10px/1 var(--mono);padding:4px 5px;border-radius:4px;color:#fff;background:var(--c);display:inline-flex;gap:3px;align-items:center}
.s.grey{--c:var(--grey)} .s.nbs{--c:var(--nbs)} .s.mar{--c:var(--mar)}
.s.shared{outline:1.5px dashed var(--ink);outline-offset:1px}
.geo{height:34px;border-radius:4px 4px 0 0;display:flex;align-items:center;justify-content:space-between;padding:0 8px;font:500 11px/1 var(--mono);color:#1c1408}
.geo.sand{background:radial-gradient(circle at 2px 2px, rgba(0,0,0,.18) 1px, transparent 1.5px) 0 0/7px 7px, var(--sand)}
.geo.silt{background:repeating-linear-gradient(0deg, rgba(0,0,0,.10) 0 2px, transparent 2px 6px), var(--silt)}
.geo.clay{background:repeating-linear-gradient(0deg, rgba(0,0,0,.16) 0 1px, transparent 1px 4px), var(--clay);color:#fff}
.geo.karst{background:repeating-linear-gradient(60deg, transparent 0 9px, rgba(0,0,0,.25) 9px 10px), repeating-linear-gradient(-30deg, transparent 0 14px, rgba(0,0,0,.18) 14px 15px), var(--karst)}
.flux{display:flex;gap:6px}
.aquifer{position:relative;height:74px;margin:0 -14px;background:linear-gradient(var(--surface-2),var(--surface-2));overflow:hidden;border-top:1px solid var(--line)}
.aqfill{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,var(--water-2),var(--aq-deep));transition:height .8s ease}
.aqtint{position:absolute;inset:0;background:var(--contam);mix-blend-mode:multiply;pointer-events:none;transition:opacity .6s}
.aqline{position:absolute;left:0;right:0;border-top:1.5px dashed var(--bad)}
.aqline.ok{border-color:var(--good)} .aqline.ok span{color:var(--good)}
.pill.good{border-color:var(--good);color:var(--good)}
.landtag{font-size:11px;color:var(--muted);font-weight:500;white-space:nowrap}
.aqline span{position:absolute;right:8px;top:-16px;font:500 10px/1 var(--mono);color:var(--bad)}
.aqtext{position:absolute;left:14px;top:8px;display:flex;flex-direction:column;gap:2px;color:var(--ink)}
.aqtext b{font-family:var(--display);font-size:22px}
.aqtext.light{color:#fff}

/* desk */
.desk{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:16px;align-items:start}
@media (max-width:860px){.desk{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.res{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.res div{display:flex;flex-direction:column;padding:8px 10px;border-radius:10px;background:var(--surface-2)}
.res b{font:600 22px/1.1 var(--display);font-variant-numeric:tabular-nums}
.res small{font-size:11px;color:var(--muted)}
@media (max-width:420px){.res{grid-template-columns:repeat(2,1fr)}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 12px;font-size:13px}
.stats span{display:flex;justify-content:space-between;gap:6px;border-bottom:1px dotted var(--line);padding-bottom:2px}
.stats b{font-family:var(--mono);font-weight:500}
@media (max-width:420px){.stats{grid-template-columns:repeat(2,1fr)}}
.list{display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:8px 10px;border:1px solid var(--line);border-radius:10px;flex-wrap:wrap}
.row .name{font-weight:600;font-size:14px}
.row .meta{font-size:12px;color:var(--muted)}
.cat{font:600 10px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;padding:3px 6px;border-radius:4px;color:#fff}
.cat.grey{background:var(--grey)} .cat.nbs{background:var(--nbs)} .cat.mar{background:var(--mar)}
.btn{border:none;border-radius:8px;padding:8px 14px;background:var(--water);color:#fff;font-weight:600;font-size:14px}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.alt{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn.big{padding:12px 22px;font-size:16px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{background:none;border:none;padding:8px 12px;font-weight:600;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--ink);border-color:var(--water)}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.step button{background:var(--surface-2);border:none;width:30px;height:30px;font-weight:700}
.step span{min-width:36px;text-align:center;font-family:var(--mono)}
.field{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.note{font-size:13px;color:var(--muted)}
.warnbox{font-size:13px;padding:8px 10px;border-radius:8px;border-left:3px solid var(--warn);background:var(--surface-2)}
.objs{display:flex;flex-direction:column;gap:6px}
.obj{border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.obj .vp{font:700 18px/1 var(--display);color:var(--water);white-space:nowrap}
.cards{display:flex;gap:6px;flex-wrap:wrap}
.card{border:1px solid var(--line);border-radius:10px;padding:8px 10px;max-width:220px;font-size:13px;display:flex;flex-direction:column;gap:6px;background:var(--surface-2)}
.card.evil{border-color:var(--bad)}
.players{display:flex;gap:6px;flex-wrap:wrap}
.pbtn{border:1px solid var(--line);border-radius:999px;padding:4px 12px;background:var(--surface);display:inline-flex;align-items:center;gap:6px;font-size:13px}
.pbtn.on{border-color:var(--pc);box-shadow:inset 0 0 0 1px var(--pc)}
.alloc{display:flex;flex-direction:column;gap:6px}
.arow{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:8px;background:var(--surface-2)}
.arow input{width:18px;height:18px;accent-color:var(--water)}
.arow .need{margin-left:auto;font-family:var(--mono);font-size:13px}
.meter{height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden;display:flex}
.meter i{display:block;height:100%}

/* log */
details.log{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 16px}
details.log summary{cursor:pointer;font-weight:600}
.logl{max-height:220px;overflow:auto;font-size:13px;display:flex;flex-direction:column;gap:2px;margin-top:8px}
.logl div{border-bottom:1px dotted var(--line);padding:2px 0}

/* overlays */
.ov{position:fixed;inset:0;background:color-mix(in srgb, var(--bg) 70%, transparent);backdrop-filter:blur(6px);display:grid;place-items:center;z-index:50;
  padding:max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));overflow:auto}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px;max-width:640px;width:100%;display:flex;flex-direction:column;gap:16px;box-shadow:0 20px 60px rgba(0,0,0,.18);max-height:100%;overflow:auto}
.sheet h2{font-size:28px;font-weight:800}
.dice{display:flex;gap:14px;justify-content:center}
.die{width:64px;height:64px;border-radius:12px;background:var(--surface-2);border:2px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:8px}
.die i{width:11px;height:11px;border-radius:50%;background:var(--ink);place-self:center;visibility:hidden}
.die i.on{visibility:visible}
.die.roll{animation:wob .5s ease}
@keyframes wob{0%{transform:rotate(-20deg) scale(.8)}60%{transform:rotate(10deg) scale(1.05)}100%{transform:none}}
@media (prefers-reduced-motion:reduce){.ecard.flip{animation:none}.die.roll{animation:none}.aqfill{transition:none}}
.wx{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.wx .sum{font:800 44px/1 var(--display)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.tbl td.n,.tbl th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.tscroll{overflow-x:auto}
.toast{position:fixed;left:50%;bottom:max(20px, env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;max-width:min(92vw,520px);box-shadow:0 8px 30px rgba(0,0,0,.25)}

/* event cards */
:root{--sev1:#2a7fa6;--sev2:#b8861c;--sev3:#cf6527;--sev4:#b5362a;--sev5:#5e2c70}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){--sev1:#4fb0d3;--sev2:#e0a63a;--sev3:#ec8a4f;--sev4:#e86d5a;--sev5:#c08ad6} }
:root[data-theme="dark"]{--sev1:#4fb0d3;--sev2:#e0a63a;--sev3:#ec8a4f;--sev4:#e86d5a;--sev5:#c08ad6}
.drawrow{display:grid;grid-template-columns:minmax(0,240px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:600px){.drawrow{grid-template-columns:1fr}}
.ecard{--sc:var(--sev1);width:100%;max-width:260px;aspect-ratio:5/7;border-radius:16px;background:var(--surface);border:2px solid var(--sc);box-shadow:0 10px 30px rgba(0,0,0,.14);display:flex;flex-direction:column;gap:10px;padding:18px 16px 14px;position:relative;overflow:hidden;margin:0 auto}
.ecard::before{content:"";position:absolute;inset:0 0 auto;height:6px;background:var(--sc)}
.ecard.sev2{--sc:var(--sev2)} .ecard.sev3{--sc:var(--sev3)} .ecard.sev4{--sc:var(--sev4)} .ecard.sev5{--sc:var(--sev5)}
.etop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pips{display:flex;gap:3px}.pips i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--sc)}.pips i.on{background:var(--sc)}
.eicons{display:flex;gap:6px;color:var(--sc)}.eicons svg{width:42px;height:42px;fill:currentColor}
.ecard h3{font-size:21px;font-weight:800;letter-spacing:-.01em}
.efx{margin:0;padding-left:16px;font-size:12.5px;display:flex;flex-direction:column;gap:3px;line-height:1.35}
.efoot{margin-top:auto;font-size:10.5px;color:var(--muted)}
.ecard.back{background:repeating-linear-gradient(135deg,var(--water) 0 12px,var(--aq-deep) 12px 24px);border-color:var(--aq-deep);display:grid;place-items:center}
.ecard.back::before{display:none}
.eback{background:var(--surface);border-radius:12px;padding:14px 22px;display:flex;flex-direction:column;align-items:center;gap:2px}
.eback b{font:800 40px/1 var(--display)}
.ecard.flip{animation:flip .6s ease}
@keyframes flip{0%{transform:perspective(800px) rotateY(90deg) scale(.92)}100%{transform:none}}
.oddswrap{display:flex;flex-direction:column;gap:10px;min-width:0}
.odds{display:flex;height:14px;border-radius:999px;overflow:hidden;gap:2px}
.odds i{display:block;height:100%}
.oddlist{display:flex;flex-direction:column;gap:4px;font-size:13px}
.oddlist span{display:grid;grid-template-columns:12px 1fr auto;gap:8px;align-items:center;border-bottom:1px dotted var(--line);padding-bottom:3px}
.oddlist span i{width:10px;height:10px;border-radius:3px;display:block}
.sevpill{border-color:var(--sc)}
.sevdot{width:9px;height:9px;border-radius:50%;background:var(--sc);display:inline-block}
.sevtag{display:inline-block;white-space:nowrap;font-size:12px;font-weight:600;color:var(--sc)}
.tier{font:600 10px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;padding:3px 6px;border-radius:4px;border:1px solid var(--water);color:var(--water);vertical-align:2px;white-space:nowrap}
.tier.t2{border-color:var(--warn);color:var(--warn)} .tier.t3{border-color:var(--bad);color:var(--bad)}
.objside{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}

/* v3: tiles carry their structure; infrastructure trees */
:root{--wetland:#4c8f86}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){--wetland:#3d7a72} }
:root[data-theme="dark"]{--wetland:#3d7a72}
.tile.wetland{background:var(--wetland)}
.tile .s.onTile{position:absolute;left:3px;right:3px;bottom:3px;justify-content:center;font-size:9.5px;padding:3px 2px;box-shadow:0 1px 3px rgba(0,0,0,.25);overflow:hidden;white-space:nowrap}
.tile:has(.onTile) svg{transform:translateY(-14%)}
.tile:has(.onTile) .dot{top:3px;bottom:auto}
.trees{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.tree{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.treehead{display:flex;flex-direction:column;gap:2px}
.treehead h3{font-size:17px}
.branch{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
.node{position:relative;display:grid;grid-template-columns:30px 1fr;column-gap:8px;padding:6px 0 10px}
.node .lv{grid-row:span 3;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11px;border:2px solid var(--c);color:var(--c);background:var(--surface);z-index:1}
.node.grey{--c:var(--grey)} .node.mar{--c:var(--mar)} .node.nbs{--c:var(--nbs)}
.node.reached .lv{background:var(--c);color:#fff}
.node:not(:last-child)::before{content:"";position:absolute;left:13px;top:30px;bottom:-6px;width:2px;background:var(--line)}
.node.reached:not(:last-child)::before{background:var(--c)}
.node .nn{font-weight:600;font-size:14px}
.inst{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:space-between;padding:6px 8px;border-radius:8px;background:var(--surface-2);font-size:13px}

/* setup + rules */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:center}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
.hero h2{font-size:clamp(34px,5vw,56px);font-weight:800;letter-spacing:-.03em}
.hero p{max-width:60ch}
.namegrid{display:flex;flex-direction:column;gap:8px}
.namegrid input{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);width:100%}
.xsec{border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.rules{display:flex;flex-direction:column;gap:14px;font-size:14px}
.rules h3{font-size:18px}
.rules ul{margin:0;padding-left:18px}
.rules p{margin:0;max-width:70ch}
.chart svg{width:100%;height:auto;display:block}

/* ===== v4 polish: the board as an illustrated hydrological cross-section ===== */
:root{
  --bg:#e8eff0; --surface:#fbfdfd; --surface-2:#eff5f6; --line:#d3dfe1;
  --shadow:0 1px 2px rgba(17,48,60,.06), 0 10px 28px -14px rgba(17,48,60,.22);
  --shadow-lg:0 24px 70px -20px rgba(10,35,45,.35);
  --gold:#c08a1c;

function log(t){ G.log.unshift(`R${G.round}: ${t}`); if(G.log.length>200) G.log.pop(); }

function sname(s){ return TYPES[s.type].names[s.level-1]; }

function share(s){ return s.owners.length>1 ? 0.5 : 1; }
/* whole-unit split of a shared structure's value: the host gets the odd unit, so the owners' parts add up to the total */
function part(s,pid,v){ if(s.owners.length<2) return v; return s.host===pid ? Math.ceil(v/2) : Math.floor(v/2); }
function count(pid,type){ return P(pid).land.filter(t=>t===type).length; }
function landSum(pid,k){ return sum(P(pid).land.map(t=>LAND[t][k]||0)); }
function stressed(){ return G.aquifer <= G.aqStress; }

/* tiles: one structure per tile, land decides which trees it can host */
function structOn(pid,tile){ return G.structs.find(s=>s.host===pid && s.tile===tile); }
function landOk(type,land){ const T=TYPES[type]; return !T.land || T.land.includes(land); }
function wellsHosted(pid){ return G.structs.filter(s=>s.host===pid && s.type==='well').length; }
function canBuildOn(pid,type,tile){
  const p=P(pid); if(tile==null||tile<0||tile>=p.land.length) return false;
  return !structOn(pid,tile) && landOk(type,p.land[tile]) && !(type==='well' && wellsHosted(pid)>=2);
}
function freeTiles(pid,type){ return P(pid).land.map((l,i)=>i).filter(i=>canBuildOn(pid,type,i)); }
function canHost(pid,type){ return freeTiles(pid,type).length>0; }
function landText(type){ const T=TYPES[type]; return T.land ? T.land.map(l=>LAND[l].name).join(', ') : 'Any land'; }
function tileLabel(pid,i){ const p=P(pid), t=p.land[i]; const same=p.land.filter(x=>x===t).length; return same>1 ? `${LAND[t].name} ${p.land.slice(0,i+1).filter(x=>x===t).length}` : LAND[t].name; }

/* shared infiltration structures pool land and work better: +1 infiltration */
function infilOf(s){ const base=stat(s,'infil'); if(!base) return 0; return Math.max(0, base + GEO[P(s.host).geo].infil + (s.owners.length>1?1:0)); }
function infilCap(pid){ return sum(owned(pid).map(s=>part(s,pid,infilOf(s)))) + landSum(pid,'infil'); }
function wellInfil(p,land){ return sum(owned(p.id).filter(s=>s.type==='well' && (!land || P(s.host).land[s.tile]===land)).map(s=>part(s,p.id,infilOf(s)))); }
function pumpCap(pid){
  if(G.aquifer<=0) return 0;
  const p=P(pid);
  let c = sum(owned(pid).filter(s=>s.type==='well').map(s=>{
    let v = stat(s,'pump') + GEO[P(s.host).geo].pump - (stressed()?1:0);
    return part(s,pid,Math.max(1,v)); }));

}
function extraStorage(pid){ return sum(owned(pid).map(s=>part(s,pid,stat(s,'storage')))) + landSum(pid,'storage'); }

function protection(pid){ return sum(owned(pid).map(s=>stat(s,'flood'))) + landSum(pid,'flood'); }
function hardening(pid){ return sum(owned(pid).map(s=>stat(s,'harden'))); }
function hasRemediation(pid){ return owned(pid).some(s=>stat(s,'clean')>0); }
function hasType(pid,t){ return owned(pid).some(s=>s.type===t); }
function marSystem(pid){ const m=owned(pid); return m.some(s=>s.type==='well'&&s.level>=2) && m.some(s=>(s.type==='storage'||s.type==='flood')&&s.level===3); }

  const cut=sum(owned(pid).map(s=>stat(s,'opexcut')));
  return Math.max(0, raw-cut);
}
function demandList(pid){

    if(t==='city') need+=G.war||0;
    if(t==='agri' && w.agriExtra) need+=w.agriExtra;
    out.push({i,t,need}); }});
  let cut=sum(owned(pid).map(s=>part(s,pid,stat(s,'cut'))));
  for(const land of ['city','agri']) for(const d of out){ if(d.t!==land) continue; while(cut>0 && d.need>1){ d.need--; cut--; } }
  return out;
}

/* ===================== OBJECTIVES =====================
   Objectives are dealt per player from their own land use and current state ("All" objectives go to
   everyone, the others only to players with that land). Tier I runs rounds 1–3, tier II rounds 4–6, tier III
   rounds 7–8. When a tier starts, unfinished objectives expire and everyone is dealt two new ones: targets
   rise and so does the VP. Each objective is checked for achievability within its tier before it is dealt:
   affordable with money + expected income, enough turns left, a free tile where it needs a structure,
   and any weather it depends on likely to come up in time. */
const tierOf = r => r<=3?1:r<=6?2:3;
const TIER = ['','I','II','III'];

const pct = x => Math.round(x*100)+'%';
const plural = (n,w) => `${n} ${w}${n===1?'':'s'}`;

function tierDraws(){ return tierTurns()-(G.weather?1:0); }
function budget(p){ return p.money+5*(tierTurns()-1); }
function deckChance(pred, draws){
  draws = draws==null ? tierDraws() : draws;
  const N=G.deck.length, k=G.deck.filter(id=>pred(CARDS[id])).length;
  if(draws<=0||k===0||N===0) return 0;
  let miss=1; for(let i=0;i<Math.min(draws,N);i++) miss*=Math.max(0,N-k-i)/(N-i);
  return 1-miss;
}
function hostedOf(p,type,land){ return G.structs.filter(s=>s.host===p.id && s.type===type && (!land || p.land[s.tile]===land)); }
function levelOf(p,type,land){ return Math.max(0,...hostedOf(p,type,land).map(s=>s.level)); }
function costToLevel(p,type,l,land){
  let best=Infinity;
  for(const s of hostedOf(p,type,land)) best=Math.min(best, sum(TYPES[type].capex.slice(s.level,l)));
  if(freeTiles(p.id,type).some(i=>!land||p.land[i]===land)) best=Math.min(best, sum(TYPES[type].capex.slice(0,l)));
  return best;
}

  inject:{land:'All', name:()=>'Inject water',

function objName(p,o){ return OBJ[o.type].name(p,o); }
function drawObjective(p, exclude){
  const recent=p.done.slice(-3).map(d=>d.type);
  for(let t=tierOf(G.round); t>=1; t--){
    const keys=shuffle(Object.keys(OBJ).filter(k=>k!==exclude && !p.objectives.some(o=>o.type===k)));
    keys.sort((a,b)=>recent.includes(a)-recent.includes(b));
    for(const k of keys){
      const prm=OBJ[k].make(p,t); if(!prm) continue;
      const o={uid:G.nextId++, type:k, tier:t, ...prm};
      if(OBJ[k].met(p,o,true)) continue;
      p.objectives.push(o); return o;
    }
  }
  return null;
}
function checkObjectives(p,eot){
  for(const o of p.objectives.slice()){
    if(!OBJ[o.type].met(p,o,eot)) continue;
    p.objectives=p.objectives.filter(x=>x!==o);
    const name=objName(p,o), m=o.tier+1;
    p.done.push({type:o.type,name,tier:o.tier,vp:o.vp});
    p.vp.objectives+=o.vp; p.money+=m;
    if(p.done.length%2===0) drawBonus(p);
    log(`${p.name} completed “${name}” (tier ${TIER[o.tier]}, +${o.vp} VP, +${m} M).`);
    toast(`${p.name} completed “${name}”: +${o.vp} VP, +${m} M`);
    drawObjective(p, o.type);
  }
}
function swapObjective(uid){
  const p=curP(); if(p.r.swapped||p.money<2) return;
  const o=p.objectives.find(x=>x.uid===uid); if(!o) return;
  const idx=p.objectives.indexOf(o);
  p.objectives.splice(idx,1);
  const fresh=drawObjective(p, o.type);
  if(!fresh){ p.objectives.splice(idx,0,o); toast('No other objective fits your catchment right now. You keep this one and your money.'); return; }
  p.money-=2; p.r.swapped=true;
  log(`${p.name} swapped an objective for 2 M.`);
}

/* ===================== EVENTS DECK ===================== */
function drawEvent(){
  const n=G.players.length;
  if(!G.deck.length){ G.deck=buildDeck(); log('The event deck was reshuffled.'); }
  const key=G.deck.pop(); const c=CARDS[key];
  const w={...c, key, notes:[], results:{}};
  G.drawn.push(key);
  if(c.war){ G.war++; w.notes.push(`Every city tile now needs +${G.war} W and pays +${G.war} M.`); }
  G.weather=w;
  for(const pid of G.order){
    const p=P(pid); const r={notes:[]};
    p.r={pumped:0,infilUsed:0,recharged:0,wellUsed:0,cityWellUsed:0,permit:false,swapped:false};
    for(const o of p.objectives) if(o.type==='reserve' && w.dry && p.water>=o.x){ o.hit=true; r.notes.push('drought reserve ✓'); }
    // water supplied by the card
    const cap=storageCap(pid);
    const take=Math.min(w.rain, Math.max(0,cap-p.water));
    p.water+=take; r.stored=take;
    const over=w.rain-take;
    // surplus soaks into the aquifer through your infiltration structures, except in flood rounds
    const inf = w.wet ? 0 : Math.min(over, infilCap(pid), G.aqMax-G.aquifer);
    G.aquifer+=inf; p.r.infilUsed=inf; p.r.recharged=inf; p.recharged+=inf; r.infil=inf; r.spill=over-inf;
    // rain overflow soaks in through forests and basins first; only the rest passes through wells
    const viaWells=Math.max(0, inf-(infilCap(pid)-wellInfil(p)));
    p.r.wellUsed=viaWells; p.r.cityWellUsed=Math.min(viaWells, wellInfil(p,'city'));
    // money supplied (or taken) by the card
    const before=p.money; p.money=Math.max(0,p.money+w.cash); r.cash=p.money-before;
    if(w.flood){ const prot=protection(pid); r.prot=prot; r.dmgText=applyFlood(pid, Math.max(0,w.flood-prot)); }
    if(w.nps && !count(pid,'wetland') && !hasType(pid,'flood')){ const k=Math.min(1,p.money); p.money-=k; if(k) r.notes.push('runoff clean-up −1 M'); }
    if(w.leach && count(pid,'agri')>=2 && !count(pid,'wetland')){ p.vp.health-=1; r.notes.push('nitrate from farmland −1 VP'); }
    if(w.contam && p.geo==='karst'){ const k=Math.min(2,p.money); p.money-=k; if(k) r.notes.push(`karst conduits −${k} M`); }
    w.results[pid]=r;
  }
  if(w.contam){ G.contamination=Math.min(3,G.contamination+w.contam); G.contamEver=true; }
  const delta=Math.round(w.nat*n);
  const before=G.aquifer; G.aquifer=clamp(G.aquifer+delta,0,G.aqMax); w.natural=G.aquifer-before;
  log(`Event card: ${c.name}. Aquifer ${w.natural>=0?'+':''}${w.natural} W from nature.`);
  G.phase='weatherResult';
  save();
}
function applyFlood(pid,dmg){
  const p=P(pid);
  dmg=Math.max(0,dmg-hardening(pid));
  if(dmg<=0) return 'protected';
  if(p.insurance>0){ p.insurance--; p.bonus.splice(p.bonus.indexOf('insurance'),1); log(`${p.name}'s flood insurance absorbed ${dmg} damage.`); return 'insured'; }
  const parts=[];
  for(let k=0;k<dmg;k++){
    // each point of damage knocks one structure above level 1 back to level 1; buildings are never destroyed
    const cand=G.structs.filter(s=>s.host===pid && s.level>1);
    if(!cand.length){ p.vp.flood-=1; parts.push('−1 VP'); continue; }
    const s=cand[Math.floor(Math.random()*cand.length)];
    const was=sname(s); s.level=1; parts.push(`${was} → ${sname(s)}`);
  }
  log(`Flood hit ${p.name}: ${parts.join(', ')}.`);
  return parts.join(', ');
}
function downgrade(s){ s.level--; if(s.level<=0) G.structs=G.structs.filter(x=>x!==s); }

/* ===================== TURN ACTIONS ===================== */
function costFor(type,level){ return TYPES[type].capex[level-1]; }
function gainLevel(p,cat,cost){
  p.spend[cat]+=cost; const before=p.levels; p.levels++;
}
function drawBonus(p){
  if(!G.bonusDeck.length) G.bonusDeck=shuffle(BONUS_DECK.slice());
  const b=G.bonusDeck.pop(); p.bonus.push(b); if(b==='insurance') p.insurance++;
  log(`${p.name} earned a bonus card for completing two objectives.`);
  toast(`${p.name} earned a bonus card: ${BONUS[b].name}`);
}
function build(type,tile){
  const p=curP(); const cost=costFor(type,1);
  if(p.money<cost || !canBuildOn(p.id,type,tile)) return;
  p.money-=cost;
  G.structs.push({id:G.nextId++,type,level:1,host:p.id,tile,owners:[p.id]});
  gainLevel(p,TYPES[type].cat[0],cost);
  log(`${p.name} built a ${TYPES[type].names[0]} on their ${tileLabel(p.id,tile).toLowerCase()} tile (${cost} M).`);
  checkObjectives(p,false);
}
function upgrade(id){
  const p=curP(); const s=G.structs.find(x=>x.id===id); if(!s||s.level>=3) return;
  const cost=costFor(s.type,s.level+1); if(p.money<cost) return;
  p.money-=cost; s.level++;
  gainLevel(p,catOf(s),cost);
  log(`${p.name} upgraded to ${sname(s)} (${cost} M).`);
  checkObjectives(p,false);
  for(const o of s.owners) if(o!==p.id) checkObjectives(P(o),false);
}
function pumpLimit(p){ return Math.max(0,Math.min(pumpCap(p.id)-p.r.pumped, G.aquifer)); }
function pump(n){
  const p=curP(); n=Math.min(n,pumpLimit(p)); if(n<=0) return;
  G.aquifer-=n; p.water+=n; p.r.pumped+=n; p.pumped+=n;
  log(`${p.name} pumped ${n} W from the aquifer.`);
  checkObjectives(p,false);
}
function sellWater(n){ const p=curP(); n=Math.min(n,p.water); if(n<=0) return; p.water-=n; p.money+=n; log(`${p.name} sold ${n} W.`); }

function proposeTrade(){
  const p=curP(), t=UI.trade; if(t.to==null) return;
  if(!(t.gm||t.gw||t.rm||t.rw)) return;
  G.pending={kind:'trade',from:p.id,to:t.to,gm:t.gm,gw:t.gw,rm:t.rm,rw:t.rw};
}
function proposeJoint(type,to,tile){
  const p=curP(); const cost=costFor(type,1); if(!canBuildOn(p.id,type,tile)) return;
  G.pending={kind:'joint',from:p.id,to,type,tile,cost,fromShare:Math.ceil(cost/2),toShare:Math.floor(cost/2)};
}
function acceptPending(){
  const q=G.pending; if(!q) return;
  const a=P(q.from), b=P(q.to);
  if(q.kind==='trade'){
    if(a.money<q.gm||a.water<q.gw||b.money<q.rm||b.water<q.rw){ toast('Trade failed: someone no longer has enough.'); G.pending=null; return; }
    a.money+=q.rm-q.gm; a.water+=q.rw-q.gw; b.money+=q.gm-q.rm; b.water+=q.gw-q.rw;
    log(`${a.name} traded with ${b.name}: gave ${q.gm} M/${q.gw} W, got ${q.rm} M/${q.rw} W.`);
    UI.trade={to:null,gm:0,gw:0,rm:0,rw:0};
  } else {
    if(a.money<q.fromShare||b.money<q.toShare||!canBuildOn(a.id,q.type,q.tile)){ toast('Joint investment failed: not enough money or the tile is taken.'); G.pending=null; return; }
    a.money-=q.fromShare; b.money-=q.toShare;
    G.structs.push({id:G.nextId++,type:q.type,level:1,host:a.id,tile:q.tile,owners:[a.id,b.id]});
    const cat=TYPES[q.type].cat[0];
    gainLevel(a,cat,q.fromShare); b.spend[cat]+=q.toShare;
    for(const x of [a,b]) x.joints++;
    log(`${a.name} and ${b.name} co-funded a shared ${TYPES[q.type].names[0]}.`);
    checkObjectives(b,false); checkObjectives(a,false);
    UI.joint=null;
  }
  G.pending=null;
}
function playBonus(idx){
  const p=curP(); const id=p.bonus[idx]; const b=BONUS[id]; if(!b||b.passive) return;
  const tgt = b.target ? UI.target : null;
  if(b.target && (tgt==null||tgt===p.id)) { toast('Choose another player first.'); return; }
  if(id==='maintenance'){ p.maintRounds=2; }
  if(id==='grant'){ p.money+=4; }
  if(id==='expert'){ p.vp.bonus+=2; }
  if(id==='permit'){ p.r.permit=true; }
  if(id==='grab'){ const t=P(tgt); const n=Math.min(2,t.water); t.water-=n; p.water+=n; log(`${p.name} grabbed ${n} W from ${t.name}.`); }
  if(id==='sabotage'){ const t=P(tgt); const c=G.structs.filter(s=>s.host===tgt && catOf(s)==='grey'); if(c.length){ const s=c[Math.floor(Math.random()*c.length)]; log(`${p.name} sabotaged ${t.name}'s ${sname(s)}.`); downgrade(s);} else log(`${p.name}'s sabotage found nothing to hit.`); }
  if(id==='levy'){ for(const t of G.players){ if(t.id===p.id) continue; const n=Math.min(2,t.money); t.money-=n; p.money+=n; } }
  p.bonus.splice(idx,1);
  log(`${p.name} played ${b.name}.`);
  checkObjectives(p,false);
}

/* allocation */
function autoAlloc(){
  const p=curP(); const dl=demandList(p.id); let left=p.water;
  const rank={city:0,agri:1,pasture:2};
  const order=[...dl].sort((a,b)=>rank[a.t]-rank[b.t]);
  const on={};
  for(const d of order){ if(left>=d.need){ on[d.i]=true; left-=d.need; } else on[d.i]=false; }
  UI.alloc={on, recharge:0, xCity:0, xAgri:0};
}
function allocSummary(){
  const p=curP(); const dl=demandList(p.id);
  if(!UI.alloc) autoAlloc();
  const a=UI.alloc;
  const used=sum(dl.filter(d=>a.on[d.i]).map(d=>d.need));
  const full=land=>{ const ds=dl.filter(d=>d.t===land); return ds.length>0 && ds.every(d=>a.on[d.i]); };
  const cityNeed=sum(dl.filter(d=>d.t==='city').map(d=>d.need)), agriNeed=sum(dl.filter(d=>d.t==='agri').map(d=>d.need));
  const maxXCity=full('city')?cityNeed:0, maxXAgri=full('agri')?agriNeed:0;
  a.xCity=clamp(a.xCity||0,0,Math.min(maxXCity, Math.max(0,p.water-used)));
  a.xAgri=clamp(a.xAgri||0,0,Math.min(maxXAgri, Math.max(0,p.water-used-a.xCity)));
  const room=G.weather.wet ? 0 : Math.max(0, infilCap(p.id)-p.r.infilUsed);
  const maxRech=Math.max(0,Math.min(room, p.water-used-a.xCity-a.xAgri, G.aqMax-G.aquifer));
  a.recharge=clamp(a.recharge,0,maxRech);
  const total=used+a.xCity+a.xAgri+a.recharge;
  const left=p.water-total;
  const cap=storageCap(p.id);
  return {dl,used,total,left,room,maxRech,maxXCity,maxXAgri,cityNeed,agriNeed,full,spill:Math.max(0,left-cap),cap,ok:total<=p.water};
}
function tileIncome(t){ return LAND[t].income + (t==='city' ? G.war : 0); }
function endTurn(){
  const p=curP(); const S=allocSummary(); if(!S.ok) return;
  const a=UI.alloc; const w=G.weather; const out=[];
  p.water-=S.total;
  let income=2, short=0;
  for(const d of S.dl){
    if(a.on[d.i]) income+=tileIncome(d.t);
    else short += d.t==='city'?2:1;
  }
  income+=count(p.id,'forest')*LAND.forest.income+count(p.id,'wetland')*LAND.wetland.income;
  const extra=(a.xCity||0)+(a.xAgri||0); income+=extra;
  p.money+=income; p.vp.shortage-=short;
  out.push(`income ${income} M${extra?` (incl. ${extra} M from extra supply)`:''}`); if(short) out.push(`shortages −${short} VP`);
  if(a.recharge>0){
    G.aquifer+=a.recharge; p.recharged+=a.recharge; p.r.recharged+=a.recharge; out.push(`recharged ${a.recharge} W`);
    // water you put in yourself goes through your wells first, city wells first among them
    const cityRoom=Math.max(0, wellInfil(p,'city')-(p.r.cityWellUsed||0));
    const wellRoom=Math.max(0, wellInfil(p)-(p.r.wellUsed||0));
    const viaWells=Math.min(a.recharge, wellRoom), viaCity=Math.min(viaWells, cityRoom);
    p.r.wellUsed=(p.r.wellUsed||0)+viaWells; p.r.cityWellUsed=(p.r.cityWellUsed||0)+viaCity;
  }
  const net=p.r.recharged-p.r.pumped;
  if(net>0){ p.money+=net; out.push(`recharge credit +${net} M`); }
  p.cityInject += p.r.cityWellUsed||0;
  const injected = p.r.wellUsed||0;
  for(const o of p.objectives){
    if(o.type==='inject' && injected>=o.x) o.hit=true;
    if(o.type==='streamflow'){ const nr=p.r.recharged-p.r.pumped; if(w.wet && p.r.pumped===0){} else o.run = nr>=o.k ? o.run+1 : 0; }
    if(o.type==='irrigate'){ const ok=S.full('agri') && a.xAgri>=Math.ceil(S.agriNeed*o.pc/100); o.run = ok ? o.run+1 : 0; }
    if(o.type==='citysupply'){ const ok=S.full('city') && a.xCity>=Math.ceil(S.cityNeed*o.pc/100); o.run = ok ? o.run+1 : 0; }
  }
  if(p.water>S.cap){ out.push(`${p.water-S.cap} W spilled (storage full)`); p.water=S.cap; }
  if(marSystem(p.id)){ p.money+=2; out.push('MAR system +2 M'); }
  let opex=opexOf(p.id);
  let guard=0;
  while(p.money<opex && guard++<20){
    const mine=owned(p.id).filter(s=>stat(s,'opex')>0).sort((x,y)=>stat(y,'opex')-stat(x,'opex'));
    if(!mine.length) break;
    log(`${p.name} could not maintain ${sname(mine[0])}; it lost a level.`); out.push(`${sname(mine[0])} decayed`);
    downgrade(mine[0]); opex=opexOf(p.id);
  }
  opex=Math.min(opex,p.money); p.money-=opex; if(opex) out.push(`running costs −${opex} M`);
  if(G.contamination>0 && p.r.pumped>0 && !hasRemediation(p.id)){
    const c=Math.min(G.contamination,p.money); p.money-=c; out.push(`water treatment −${c} M`);
  }
  if(p.maintRounds>0) p.maintRounds--;
  checkObjectives(p,true);
  log(`${p.name} ended the turn: ${out.join(', ')}.`);
  toast(`${p.name}: ${out.join(' · ')}`);
  UI.alloc=null;
  G.ti++;
  if(G.ti>=G.players.length) endRound(); else { G.cur=G.order[G.ti]; G.phase='pass'; }
  save();
}
function endRound(){
  const clean=sum(G.structs.map(s=>stat(s,'clean')));
  if(clean && G.contamination){ const c=Math.min(clean,G.contamination); G.contamination-=c; log(`Remediation removed ${c} contamination.`); }
  if(stressed() && G.aquifer>0){ G.contamination=Math.min(3,G.contamination+1); G.contamEver=true; log('Aquifer below the stress line: saltwater intrusion, contamination +1.'); }
  if(G.contamination>=2){ for(const p of G.players) p.vp.health-=1; log('Contamination 2+: every player loses 1 VP (public health).'); }
  if(healthy()){ for(const p of G.players) p.vp.aquifer+=1; log(`Aquifer at or above its starting level (${G.aqStart} W): every player gains 1 VP.`); }
  else if(stressed()){ for(const p of G.players) p.vp.aquifer-=1; log('Aquifer below the stress line: every player loses 1 VP.'); }
  G.history.push({round:G.round,aquifer:G.aquifer,contam:G.contamination});
  if(G.round>=ROUNDS){ for(const p of G.players) checkObjectives(p,false); G.phase='end'; log('Game over.'); save(); return; }
  G.round++; G.start=(G.start+1)%G.players.length; G.order=orderFrom(G.start); G.ti=0; G.cur=G.order[0];
  G.phase='weather'; G.weather=null;
  if(tierOf(G.round)>tierOf(G.round-1)){
    for(const p of G.players){ checkObjectives(p,false); p.objectives=[]; drawObjective(p); drawObjective(p); }
    log(`Objectives move up to tier ${TIER[tierOf(G.round)]}: unfinished objectives expired and everyone was dealt two new ones.`);
  }
  save();
}
function finalScores(){
  const best=Math.max(...G.players.map(netRecharge));
  return G.players.map(p=>{
    const steward = best>0 && netRecharge(p)===best ? 3 : 0;
    const rows={Objectives:p.vp.objectives, 'Aquifer health':p.vp.aquifer, Steward:steward, Shortages:p.vp.shortage, Floods:p.vp.flood, Pollution:p.vp.health, Bonus:p.vp.bonus};
    return {p,rows,total:sum(Object.values(rows))};
  }).sort((a,b)=>b.total-a.total || b.p.money-a.p.money);
}

        ${next!=null?`<button class="btn sm" data-act="upgrade" data-id="${s.id}" ${p.money<next?'disabled':''}>Upgrade to ${esc(T.names[s.level])} · ${next} M</button>`:'<span class="note">top of the tree</span>'}</div>`; }).join('');
    const free=freeTiles(p.id,type), c=costFor(type,1);
    const builds = free.length ? `<div class="field">${free.map(i=>`<button class="btn sm" data-act="build" data-t="${type}" data-tile="${i}" ${p.money<c?'disabled':''}>Build on ${esc(tileLabel(p.id,i).toLowerCase())} · ${c} M</button><button class="btn sm alt" data-act="jointPick" data-t="${type}" data-tile="${i}" title="Split the cost with another player">Co-fund</button>`).join('')}</div>`
      : `<p class="note">${type==='well'&&wellsHosted(p.id)>=2?'You already have 2 wells.':`No free ${landText(type).toLowerCase()} tile.`}</p>`;
    const jrow = j && j.type===type ? `<div class="field"><span class="note">Co-fund on your ${esc(tileLabel(p.id,j.tile).toLowerCase())} with (you pay ${Math.ceil(c/2)} M, they pay ${Math.floor(c/2)} M):</span>${G.players.filter(o=>o.id!==p.id).map(o=>`<button class="pbtn" style="--pc:${o.color}" data-act="jointWith" data-p="${o.id}" ${p.money<Math.ceil(c/2)?'disabled':''}>${pChip(o)}${esc(o.name)}</button>`).join('')}</div>` : '';
    return `<section class="tree">
      <div class="treehead"><h3>${T.tree}</h3><span class="landtag">${T.role} · built on ${landText(type).toLowerCase()}</span></div>
      <ol class="branch">${nodes}</ol>
      <p class="meta">${T.desc}</p>
      ${rows}${builds}${jrow}
    </section>`;
  }).join('');
  return `<p class="note">Each tile holds one structure. Build at the root of a tree, then upgrade it in place. Shared infiltrating structures soak in +1 W.</p><div class="trees">${trees}</div>`;
}
function describeLevel(t,l){
  const T=TYPES[t], i=l-1, parts=[];
  if(T.pump) parts.push(`pump ${T.pump[i]}`);
  if(T.infil && T.infil[i]) parts.push(`infiltrate ${T.infil[i]}`);
  if(T.storage && T.storage[i]) parts.push(`store +${T.storage[i]}`);
  if(T.flood) parts.push(`flood protection ${T.flood[i]}`);
  if(T.cut) parts.push(`demand −${T.cut[i]}`);
  if(T.opexcut && T.opexcut[i]) parts.push(`running costs −${T.opexcut[i]}`);
  if(T.harden && T.harden[i]) parts.push('absorbs 1 flood damage');
  if(T.clean && T.clean[i]) parts.push('cleans 1');
  return parts.join(' · ');
}

function aqChart(){

  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Aquifer level by round">

}

    <h3>Event deck (${DECK_SIZE} cards, drawn without replacement)</h3>
    <div class="tscroll"><table class="tbl"><thead><tr><th>Card</th><th>Severity</th><th class="n">Copies</th><th class="n">First-draw chance</th><th>Effects</th></tr></thead><tbody>
      ${CARD_ORDER.map(k=>{const c=CARDS[k]; return `<tr><td><b>${esc(c.name)}</b></td><td><span class="sevtag" style="--sc:var(--sev${c.sev})">${c.sev} · ${SEV_NAME[c.sev]}</span></td><td class="n">${c.copies}</td><td class="n">${(c.copies/DECK_SIZE*100).toFixed(1)}%</td><td>${cardEffects(c).map(esc).join('; ')}</td></tr>`;}).join('')}
    </tbody></table></div>
    <h3>Secret objectives</h3>
    <ul>
      <li>Each player holds two. Land-specific objectives only go to players with that land; the rest go to everyone. Each one is checked before it is dealt: affordable with what you hold plus expected income, enough turns left, a free tile where it needs a structure, and any weather it depends on likely to come up in time.</li>
      <li>Difficulty rises: tier I in rounds 1–3, tier II in rounds 4–6, tier III in rounds 7–8. When a new tier starts, unfinished objectives expire and everyone is dealt two new ones. A completed objective pays its VP plus tier + 1 M, and you draw a new one at the current tier. Every second objective you complete also earns a bonus card.</li>
    </ul>
    <div class="tscroll"><table class="tbl"><thead><tr><th>Objective</th><th>Land use</th></tr></thead><tbody>${objRows}</tbody></table></div>
    <h3>Shared aquifer</h3>
    <p>It starts at 6 + 5 W per player and holds at most 10 + 10 W per player. Winter rain refills it, droughts drain it (2–3 W per player), and floods add nothing because the water runs off. Every W you pump comes out of everyone's supply. At or below the stress line (3 W per player) every well pumps 1 less and saltwater intrudes each round.</p>
    <p><b>Why recharge?</b> At the end of your turn you earn 1 M for every W you put in this round beyond what you pumped. Every round the aquifer is at or above its starting level, everyone gains 1 VP; below the stress line, everyone loses 1 VP. The player with the highest net recharge at the end is the groundwater steward (+3 VP). Contamination makes every player who pumps without a cleaning system pay 1 M per level.</p>
    <h3>Final scoring</h3>
    <ul><li>Objectives completed, plus aquifer-health points collected each round, plus the groundwater steward bonus and bonus cards.</li><li>Minus shortage, flood and pollution losses.</li><li>Money left at the end scores nothing; it only breaks ties.</li></ul>
    <p class="note">All values are first drafts for playtesting.</p>
  </div></div>`;
}

/* ===================== EVENTS ===================== */
document.addEventListener('input', e=>{
  const i=e.target.dataset.name; if(i!=null) UI.names[+i]=e.target.value;
});
document.addEventListener('click', e=>{
  const el=e.target.closest('[data-act]'); if(!el || el.disabled) return;
  const act=el.dataset.act;
  if(act==='toggleTile'){ UI.alloc.on[+el.dataset.i]=el.checked; render(); return; }
  switch(act){
    case 'setN': UI.nPlayers=+el.dataset.n; break;
    case 'start': newGame(UI.names.slice(0,UI.nPlayers)); break;
    case 'resume': G=loadSaved(); break;
    case 'askNew': UI.confirmNew=true; break;
    case 'cancelNew': UI.confirmNew=false; break;
    case 'newgame': clearSaved(); G=null; UI.confirmNew=false; break;
    case 'rules': UI.rules=true; break;
    case 'closeRules': UI.rules=false; break;
    case 'draw': drawEvent(); break;
    case 'swapObj': swapObjective(+el.dataset.u); save(); break;
    case 'weatherContinue': G.ti=0; G.cur=G.order[0]; G.phase='pass'; save(); break;
    case 'beginTurn': G.phase='turn'; checkObjectives(curP(),false); UI.tab='build'; UI.showObj=false; UI.alloc=null; UI.trade={to:null,gm:0,gw:0,rm:0,rw:0}; UI.joint=null; UI.target=null; UI.pumpN=1; save(); break;
    case 'tab': UI.tab=el.dataset.t; if(UI.tab==='alloc' && !UI.alloc) autoAlloc(); break;
    case 'toggleObj': UI.showObj=!UI.showObj; break;
    case 'build': build(el.dataset.t,+el.dataset.tile); save(); break;
    case 'upgrade': upgrade(+el.dataset.id); save(); break;
    case 'jointPick': UI.joint = UI.joint&&UI.joint.type===el.dataset.t&&UI.joint.tile===+el.dataset.tile ? null : {type:el.dataset.t, tile:+el.dataset.tile}; break;
    case 'jointWith': if(UI.joint) proposeJoint(UI.joint.type,+el.dataset.p,UI.joint.tile); break;
    case 'pump': pump(UI.pumpN); UI.alloc=null; save(); break;
    case 'sell': sellWater(UI.sellN); UI.alloc=null; save(); break;
    case 'tradeTo': UI.trade={to:+el.dataset.p,gm:0,gw:0,rm:0,rw:0}; break;
    case 'proposeTrade': proposeTrade(); break;
    case 'accept': acceptPending(); UI.alloc=null; save(); break;
    case 'decline': log(`${P(G.pending.to).name} declined ${P(G.pending.from).name}'s offer.`); G.pending=null; break;
    case 'target': UI.target=+el.dataset.p; break;
    case 'playBonus': playBonus(+el.dataset.i); UI.alloc=null; save(); break;
    case 'autoAlloc': autoAlloc(); break;
    case 'endTurn': endTurn(); break;
    case 'step': {
      const k=el.dataset.key, d=+el.dataset.d;
      if(k.startsWith('trade.')) UI.trade[k.slice(6)]=Math.max(0,UI.trade[k.slice(6)]+d);
      else if(k.startsWith('alloc.')) UI.alloc[k.slice(6)]=Math.max(0,(UI.alloc[k.slice(6)]||0)+d);
      else UI[k]=Math.max(0,UI[k]+d);
      break; }
  }
  render();
});

/* hot reload: keep the running game */
if(window.claude?.hot?.snapshot) window.claude.hot.snapshot(()=>({G}));
function startApp(data){ if(data && data.G && data.G.v===3) G=data.G; render(); }
window.claude?.hot?.ready ? window.claude.hot.ready(startApp) : startApp(window.claude?.hot?.data ?? {});
</script>
